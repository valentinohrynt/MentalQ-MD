name: Android CI and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and debug build
        run: ./gradlew testDebugUnitTest assembleDebug

  release:
    name: Signed release
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GS_CREDENTIALS: ${{ secrets.GS_CREDENTIALS }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      DRIVE_CREDENTIALS: ${{ secrets.CREDENTIALS }}
      DRIVE_FOLDER_ID: ${{ secrets.FOLDER_ID }}
      ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: app/release.keystore
      ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      ORG_GRADLE_PROJECT_VERSION_CODE: ${{ github.run_number }}
      ORG_GRADLE_PROJECT_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate required secrets
        shell: bash
        run: |
          missing=()
          for name in \
            GS_CREDENTIALS \
            GOOGLE_WEB_CLIENT_ID \
            RELEASE_KEYSTORE_BASE64 \
            RELEASE_STORE_PASSWORD \
            RELEASE_KEY_ALIAS \
            RELEASE_KEY_PASSWORD \
            DRIVE_CREDENTIALS \
            DRIVE_FOLDER_ID; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required repository secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Prepare Firebase and signing files
        shell: bash
        run: |
          umask 077
          printf '%s' "$GS_CREDENTIALS" | base64 --decode > app/google-services.json
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          printf 'GOOGLE_WEB_CLIENT_ID=%s\n' "$GOOGLE_WEB_CLIENT_ID" > local.properties

      - name: Build signed APK and app bundle
        run: ./gradlew testReleaseUnitTest assembleRelease bundleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$apksigner_path" ]]; then
            echo "apksigner was not found" >&2
            exit 1
          fi
          "$apksigner_path" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Name release artifacts
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk "MentalQ-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "MentalQ-${GITHUB_RUN_NUMBER}.aab"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MentalQ-release-${{ github.run_number }}
          path: |
            MentalQ-${{ github.run_number }}.apk
            MentalQ-${{ github.run_number }}.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed APK to Google Drive
        uses: adityak74/google-drive-upload-git-action@935eccf4c2812e4d492c3d7c7ff59ca7520bf129
        with:
          credentials: ${{ secrets.CREDENTIALS }}
          filename: app/build/outputs/apk/release/app-release.apk
          folderId: ${{ secrets.FOLDER_ID }}
          overwrite: "true"

      - name: Set release tag
        id: release
        shell: bash
        run: echo "tag=v$(date -u +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: MentalQ ${{ steps.release.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: |
            MentalQ-${{ github.run_number }}.apk
            MentalQ-${{ github.run_number }}.aab
